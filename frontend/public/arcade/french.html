<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>French — Language Arcade</title>
<style>
:root{
  --ink:#191c3a;--ink-2:#343a63;--muted:#6d7194;--paper:#fdf7ea;--card:#fffdf8;--line:#e7dcc4;
  --blue:#2b5bd7;--red:#d63b3b;--indigo:#5b6cff;--teal:#0fb5a1;--amber:#ffb703;--grape:#8b46d9;
  --good:#1e9e6a;--bad:#e5484d;--hard:6px 6px 0 var(--ink);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:17px}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Nunito","Trebuchet MS",system-ui,sans-serif;
  background:
    radial-gradient(840px 520px at 2% -8%,#dbe2ff 0%,transparent 62%),
    radial-gradient(780px 520px at 102% 4%,#ffe6b0 0%,transparent 58%),
    radial-gradient(760px 560px at 50% 118%,#cdf5ec 0%,transparent 62%),
    var(--paper);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(25,28,58,.09) 1px,transparent 1.3px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.3) 50%,transparent 82%);
  mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.3) 50%,transparent 82%);
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.shell{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:20px 18px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-weight:900;font-size:.82rem;background:var(--card);border:2px solid var(--ink);padding:8px 13px;border-radius:999px;box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.back:hover{transform:translate(-1px,-1px)}
.chip{display:flex;align-items:center;gap:7px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:10px 16px;font-size:.78rem;font-weight:900;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.kicker{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--blue);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;box-shadow:0 2px 0 var(--ink);margin-bottom:14px}
h1{margin:0;font-size:clamp(2rem,6vw,2.9rem);line-height:.98;letter-spacing:-.045em;font-weight:900}
h1 span{color:var(--blue)}
.sub{margin:12px 0 0;color:var(--ink-2);font-size:1.06rem;line-height:1.55;max-width:54ch}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:22px;box-shadow:var(--hard);margin-top:20px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
@media (max-width:640px){.tiers{grid-template-columns:1fr}}
.tierbtn{font-family:inherit;text-align:left;cursor:pointer;background:#fbf5e6;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,background .15s}
.tierbtn:hover{background:#fff}
.tierbtn[aria-pressed="true"]{background:var(--blue);color:#fff}
.tierbtn b{display:block;font-size:1rem;font-weight:900}
.tierbtn span{display:block;font-size:.78rem;opacity:.85;margin-top:3px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.modebtn{font-family:inherit;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:#fbf5e6;border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,background .15s}
.modebtn:hover{background:#fff;transform:translate(-1px,-1px)}
.modebtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.modebtn .ic{font-size:1.5rem;line-height:1}
.modebtn b{display:block;font-size:1rem;font-weight:900}
.modebtn small{display:block;font-size:.8rem;color:var(--ink-2);margin-top:4px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:#fbf5e6;border:2px solid var(--ink);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.stage{display:none}
.stage.on{display:block}
.bar{height:12px;background:#efe6d2;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff}
.badge.tier{background:var(--amber)}
.badge.pos{background:#e6f7f2}
.badge.gender{background:#ffe9e9}
.badge.origin{background:#efe6ff}
.wordbig{margin:0;font-size:clamp(2.2rem,8vw,3.4rem);font-weight:900;letter-spacing:-.03em;line-height:1.05}
.sayline{margin:8px 0 16px;font-size:1.05rem;color:var(--muted);font-weight:700}
.def{margin:0 0 12px;font-size:1.15rem;font-weight:800}
.sent{margin:0 0 16px;font-size:1.08rem;line-height:1.55;color:var(--ink-2)}
.sent b{background:#fff3c4;border-radius:4px;padding:0 2px}
.explain{display:grid;gap:8px}
.exrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:#fbf5e6;border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
.exrow p{margin:0;font-size:.95rem;line-height:1.5}
.extag{font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:6px;padding:3px 7px;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:900;cursor:pointer;border:2px solid var(--ink);border-radius:999px;padding:11px 18px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:1px 1px 0 var(--ink)}
.btn.small{font-size:.85rem;padding:8px 14px}
.btn.soft{background:#eef1ff}
.btn.primary{background:var(--blue);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.navrow{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
.dprompt{background:#fbf5e6;border:2px solid var(--ink);border-radius:16px;padding:18px;margin-bottom:14px}
.dkind{font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.dprompt .big{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:900;margin:0;line-height:1.2}
.dprompt .small{margin:8px 0 0;font-size:1rem;color:var(--ink-2)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.opt{font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,background .15s}
.opt:hover{background:#f4f7ff}
.opt:active{transform:translateY(2px);box-shadow:2px 2px 0 var(--ink)}
.opt.right{background:#d8f5e6;border-color:var(--good)}
.opt.wrong{background:#ffe0e0;border-color:var(--bad)}
.opt:disabled{cursor:default}
.typerow{display:flex;gap:10px}
#dInput{flex:1;font-family:inherit;font-size:1.3rem;font-weight:800;padding:14px 16px;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:inset 0 2px 0 rgba(25,28,58,.06)}
#dInput:focus{outline:3px solid #b9c2ff;outline-offset:1px}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.akey{font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;box-shadow:0 2px 0 var(--ink)}
.akey:active{transform:translateY(2px);box-shadow:none}
.hintbox{margin-top:10px;background:#fffbe8;border:2px dashed var(--amber);border-radius:12px;padding:12px;font-size:.95rem;line-height:1.5}
.feedback{margin-top:14px;border-radius:14px;padding:0;border:2px solid transparent;display:none}
.feedback.on{display:block;padding:14px 16px}
.feedback.good{background:#e8faf1;border-color:var(--good)}
.feedback.bad{background:#ffecec;border-color:var(--bad)}
.feedback h3{margin:0 0 8px;font-size:1.05rem}
.feedback p{margin:0 0 6px;font-size:.95rem;line-height:1.5}
.answerline{margin:0 0 8px!important}
.trickline{color:#7a4b00;font-weight:700}
.missed{margin-top:18px;background:#fbf5e6;border:2px solid var(--ink);border-radius:16px;padding:16px}
.missed h4{margin:0 0 10px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.missrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed #ddd2b8;font-size:.95rem}
.missrow:first-of-type{border-top:0}
.stars{display:flex;gap:8px;justify-content:center;margin:10px 0 6px;font-size:2rem}
.stars span{opacity:.22}
.stars span.on{opacity:1}
.donebox{text-align:center;padding:8px 0}
#doneTitle{margin:6px 0;font-size:1.6rem;font-weight:900}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
  <script src="./errors.js"></script>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="shell">
  <div class="top">
    <a class="back" href="./session.html">← Session</a>
    <div class="chip"><span class="k">Best</span><span class="v" id="hudBest">0%</span></div>
  </div>

  <!-- HOME -->
  <section class="stage on" id="home">
    <div class="kicker">Language arcade</div>
    <h1>French</h1>
    <p class="sub">Learn the word, then prove you know it. Every card carries the pronunciation,
      the meaning, a sentence, and the one thing English speakers get wrong.</p>
    <div class="panel">
      <div class="tiers" id="tiers"></div>
      <div class="modes" id="modes"></div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <!-- LEARN -->
  <section class="stage" id="learn">
    <div class="meta"><span>Learn</span><span><b id="lNum">1</b> / <span id="lTot">1</span></span></div>
    <div class="bar"><i id="lProg"></i></div>
    <div class="panel" id="lCard"></div>
    <div class="navrow">
      <button class="btn" type="button" id="lExit">Exit</button>
      <div class="actions">
        <button class="btn" type="button" id="lPrev">Back</button>
        <button class="btn primary" type="button" id="lNext">Next →</button>
      </div>
    </div>
  </section>

  <!-- DRILL -->
  <section class="stage" id="drill">
    <div class="meta"><span>Practice</span><span><b id="dNum">1</b> / <span id="dTot">1</span> · <span id="dScore">0 right</span></span></div>
    <div class="bar"><i id="dProg"></i></div>
    <div class="panel">
      <div class="dprompt">
        <div class="dkind" id="dKind">Recall</div>
        <div id="dPrompt"></div>
      </div>
      <div class="choices" id="dChoices"></div>
      <div id="dType" hidden>
        <div class="typerow">
          <input id="dInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">
          <button class="btn primary" type="button" id="dSubmit">Check</button>
        </div>
        <div class="accents" id="dAccents" hidden></div>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="btn soft small" type="button" id="dHint">Clue</button>
        <button class="btn soft small" type="button" id="dSay">🔊 Say it</button>
      </div>
      <div class="hintbox" id="dHintBox" hidden></div>
      <div class="feedback" id="dFb"></div>
      <div class="navrow">
        <button class="btn" type="button" id="dExit">Exit</button>
        <button class="btn primary" type="button" id="dNext" hidden>Next →</button>
      </div>
    </div>
  </section>

  <!-- DONE -->
  <section class="stage" id="done">
    <div class="panel donebox">
      <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
      <h2 id="doneTitle">Deck complete!</h2>
      <p class="sub" id="doneText"></p>
      <div class="missed" id="missed" hidden></div>
      <div class="actions" style="justify-content:center;margin-top:18px">
        <button class="btn" type="button" id="rHome">Home</button>
        <button class="btn primary" type="button" id="rAgain">Another deck</button>
      </div>
    </div>
  </section>
</div>

<script src="./french-bank.js"></script>
<script src="./lang-engine.js"></script>
<script src="./session.js"></script>
<script>
(() => {
  'use strict';
  const BANK = Array.isArray(window.FRENCH_BANK) ? window.FRENCH_BANK : [];
  const fold = window.LangGame.fold;
  const esc = window.LangGame.esc;
  const shuffle = window.LangGame.shuffle;

  const isNoun = e => e.pos === 'noun' && e.gender;

  /* The bank stores each noun with its article already ("le père"), so the
     article is shown as stored and never prepended twice. */
  const withArticle = e => e.fr;
  // "l'oncle" has no space after the apostrophe, so the elided form needs its
  // own branch: a \s+ after l' never matches and the prompt would show the
  // article it is asking for.
  const bareWord = e => e.fr.replace(/^(le|la|les|un|une)\s+/i, '').replace(/^l['’]/i, '');
  const articleOf = e => (e.fr.match(/^(le|la|les|un|une)\b/i) || e.fr.match(/^l['’]/i) || [''])[0].toLowerCase();

  function sentenceHTML(e) {
    const s = e.ex_fr || '', head = e.fr.toLowerCase().replace(/^(le|la|les|l'|un|une)\s*/i, '');
    const low = s.toLowerCase();
    for (let n = head.length; n >= 4; n--) {
      const i = low.indexOf(head.slice(0, n));
      if (i >= 0) {
        let end = i + n;
        while (end < s.length && /[a-zà-ÿ'-]/i.test(s[end])) end++;
        return esc(s.slice(0, i)) + '<b>' + esc(s.slice(i, end)) + '</b>' + esc(s.slice(end));
      }
    }
    return esc(s);
  }

  function distractors(e, n, key) {
    const others = BANK.filter(o => o.tier === e.tier && o.en !== e.en && o.fr !== e.fr);
    const near = others.filter(o => o.family === e.family && o.pos === e.pos);
    const pool = (near.length >= n ? near : others);
    return shuffle(pool.slice()).slice(0, n).map(o => o[key]);
  }

  function fr2en(e) {
    {
      return {
        type: 'choose', kind: 'Meaning',
        prompt: `<p class="big">${esc(withArticle(e))}</p><p class="small">${esc(e.say)}</p>`,
        options: shuffle([e.en, ...distractors(e, 3, 'en')]).map(v => ({ value: v })),
        answer: e.en, short: withArticle(e),
        hint: e.trap, note: e.ex_en
      };
    }
  }

  function en2fr(e) {
    return {
      type: 'type', kind: 'Write it',
      prompt: `<p class="big">${esc(e.en)}</p><p class="small">${e.pos}${e.gender ? ' · ' + (e.gender === 'm' ? 'masculine' : 'feminine') : ''} · ${esc(e.family)}</p>`,
      answer: withArticle(e), short: e.en,
      hint: `${e.say} — ${e.trap}`,
      note: e.ex_fr,
      accents: ['é', 'è', 'ê', 'à', 'ç', 'ù', 'ô', 'î', 'û', 'ë', 'ï']
    };
  }

  /* The article is a fact about a noun, so the drill is nouns only. A word
     that is not a noun cannot answer it and is served as a meaning question
     instead rather than being skipped, which would shorten the deck.

     A noun that elides is asked as le/la, not as l'. The elision is
     mechanical -- it follows from the vowel -- so asking it would test the
     spelling rule rather than the gender. The prompt shows the bare word, and
     the feedback shows the article as the bank stores it, so the learner sees
     the elided form without having to produce it.

     A plural noun is asked as les, whatever its singular gender: "les
     parents" is masculine but takes les, and the gender field records the
     singular. */
  function articlePrompt(e) {
    if (!isNoun(e)) return fr2en(e);
    const stored = articleOf(e);
    const art = stored === 'les' ? 'les' : e.gender === 'f' ? 'la' : 'le';
    // Shuffled: building the list with the answer first would put it in the
    // same position on every card.
    const opts = shuffle(['le', 'la', 'les']);
    return {
      type: 'choose', kind: 'Article',
      prompt: `<p class="big">${esc(bareWord(e))}</p><p class="small">“${esc(e.en)}” — which article?</p>`,
      options: opts.map(a => ({ value: a, label: a + (a === 'le' ? ' — masculine' : a === 'la' ? ' — feminine' : a === 'les' ? ' — plural' : '') })),
      answer: art, short: bareWord(e),
      hint: e.trap,
      // Written before the elision, "l'oncle" takes le; the note shows the
      // form the learner will actually see in a sentence.
      note: stored && stored !== art && stored.startsWith('l')
        ? `In a sentence it elides: ${e.fr}. ${e.ex_fr}`
        : e.ex_fr
    };
  }

  function prompt(mode, e, bank) {
    if (mode === 'gender') return articlePrompt(e);
    if (mode === 'fr2en') return fr2en(e);
    if (mode === 'sentence') return sentencePrompt(e);
    return en2fr(e);
  }

  /* Sentence mode: the learner reads a French sentence and picks the English
     that matches. The distractors are the translations of other sentences in
     the same family, so the choice turns on the words, not on the topic. */
  function sentencePrompt(e) {
    const same = BANK.filter(o => o.tier === e.tier && o.ex_en !== e.ex_en && o.family === e.family);
    const pool = same.length >= 3 ? same : BANK.filter(o => o.tier === e.tier && o.ex_en !== e.ex_en);
    const opts = shuffle([e.ex_en, ...shuffle(pool.slice()).slice(0, 3).map(o => o.ex_en)]);
    return {
      type: 'choose', kind: 'Sentence',
      prompt: `<p class="big" style="font-size:1.35rem">${esc(e.ex_fr)}</p>
        <p class="small">What does this sentence mean?</p>`,
      options: opts.map(v => ({ value: v })),
      answer: e.ex_en, short: e.ex_fr,
      hint: `${esc(e.say)} — ${esc(e.trap)}`,
      note: `${bareWord(e)} = ${e.en}`
    };
  }

  function check(raw, e, spec) {
    const want = spec.answer;
    if (raw.trim().toLowerCase() === want.toLowerCase()) return true;
    // Accents are a keyboard problem; a word spelled right without them is a
    // pass with a note, not a failure.
    if (fold(raw) === fold(want)) return 'accent';
    // The article may be omitted in the en2fr direction and still be right.
    const bare = want.replace(/^(le|la|les|l'|un|une)\s*/i, '');
    if (fold(raw) === fold(bare)) return 'accent';
    return false;
  }

  window.LangGame.init({
    bank: BANK, key: 'arcade.french.v1', total: 30, lang: 'fr-FR',
    keyOf: e => e.fr.toLowerCase(),
    tiers: [
      { n: 1, name: 'Débutant', note: 'ages 8–9' },
      { n: 2, name: 'Élémentaire', note: 'ages 10–11' },
      { n: 3, name: 'Intermédiaire', note: 'ages 12–14' }
    ],
    modes: [
      { id: 'learn', icon: '📖', name: 'Learn', desc: 'The word, its sound, its meaning, a sentence, and the trap.' },
      { id: 'gender', icon: '⚖️', name: 'le or la', desc: 'Nouns only. The article is the fact you cannot look up from the ending.' },
      { id: 'fr2en', icon: '🇫🇷', name: 'French → English', desc: 'Read the word, pick the meaning.' },
      { id: 'en2fr', icon: '✍️', name: 'English → French', desc: 'Write the French, article included. Accents forgiven, spelling not.' },
      { id: 'sentence', icon: '💬', name: 'Sentences', desc: 'Read a whole French sentence and pick its meaning. Grammar in use, not in pieces.' }
    ],
    word: e => withArticle(e),
    pool: (mode, e) => mode !== 'gender' || isNoun(e),
    say: e => e.say,
    meaning: e => e.en,
    sentenceHTML,
    speechWord: e => e.fr,
    speechSentence: e => e.ex_fr,
    badges: e => [
      { kind: 'tier', text: 'Tier ' + e.tier },
      { kind: 'pos', text: e.pos },
      e.gender ? { kind: 'gender', text: e.gender === 'm' ? 'masculine' : 'feminine' } : null,
      { kind: 'origin', text: e.family }
    ],
    extra: e => `<div class="exrow"><span class="extag">Say</span><p>${esc(e.say)}</p></div>`,
    prompt, check
  });
})();
</script>
</body>
</html>
